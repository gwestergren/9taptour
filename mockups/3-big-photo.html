<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup 3 · Big photo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--ink:#15212b;--muted:#5a6773;--red:#c7362b;--navy:#12303b;--cream:#fbf6ec;--gold:#e3c286}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:18px/1.6 Figtree,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.hero{position:relative;min-height:720px;color:#fff;overflow:hidden;background:#0d1a20}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,16,.92) 0%,rgba(6,12,16,.65) 45%,rgba(6,12,16,.1) 75%),linear-gradient(0deg,rgba(6,12,16,.85),transparent 40%)}
.hero>*{position:relative;z-index:2}
.bar{display:flex;align-items:center;gap:14px;padding:18px 0}.bar img{width:56px}.bar b{font:900 26px Figtree;letter-spacing:.02em}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:8px 12px;border-radius:30px}nav a.on{background:rgba(255,255,255,.16)}nav a.join{background:var(--red)}
.copy{max-width:640px;padding:80px 0 40px}
.eyebrow{font:800 14px Figtree;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.copy h1{font:900 clamp(56px,8vw,104px)/.95 Figtree;margin:10px 0 14px;letter-spacing:-.02em}
.copy p{font-size:21px;color:#dfe7ea;margin:0 0 24px}
.btn{display:inline-block;font-weight:800;font-size:18px;padding:14px 24px;border-radius:40px;text-decoration:none;background:var(--red);color:#fff}.btn.light{background:#fff;color:var(--ink);margin-left:10px}
.numbers{display:flex;gap:34px;flex-wrap:wrap;margin-top:34px}.numbers b{display:block;font:900 36px Figtree;color:#fff}.numbers span{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#b9c6cc}
.credit{position:absolute;right:22px;top:80px;font-size:13px;color:#c9d3d8;z-index:2}
.next{margin-top:-70px;position:relative;z-index:5}
.nextcard{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(10,30,40,.18);display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:24px 30px}
.cal{background:var(--red);color:#fff;border-radius:16px;text-align:center;width:110px;padding:10px 0}.cal span{display:block;font-weight:800;letter-spacing:.14em;font-size:15px}.cal b{font:900 54px/1 Figtree}
.nextcard h2{font:900 34px/1.1 Figtree;margin:2px 0}.nextcard .m{color:var(--muted)}.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.chips span{background:#eef3f5;border-radius:20px;padding:4px 12px;font-weight:700;font-size:16px}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:40px auto}
.pot{border-radius:22px;padding:30px;color:#fff}.pot.j{background:linear-gradient(135deg,#c7362b,#8f1f17)}.pot.p{background:linear-gradient(135deg,#1f4f60,#12303b)}
.pot span{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px;opacity:.85}.pot b{display:block;font:900 clamp(52px,6vw,76px)/1.05 Figtree;margin:6px 0}.pot p{margin:0;opacity:.9}
.sec{background:var(--cream);padding:56px 0}.sechead{text-align:center;margin-bottom:26px}.sechead h2{font:900 48px/1 Figtree;margin:8px 0 18px}
.toggle{display:inline-flex;background:#fff;border-radius:40px;padding:5px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.toggle a{padding:10px 20px;border-radius:40px;font-weight:800;text-decoration:none;color:var(--muted)}.toggle a.on{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stats div{background:#fff;border-radius:18px;padding:18px;text-align:center}.stats b{display:block;font:900 32px Figtree;color:var(--red)}.stats span{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:26px}.pick a{background:#fff;border-radius:30px;padding:6px 14px;font-weight:700;text-decoration:none;color:var(--ink);font-size:16px}.pick a.on{background:var(--navy);color:#fff}.pick a.off{opacity:.4}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06)}.card .ph{aspect-ratio:4/3}.card .b{padding:14px 18px 18px}.card .d{font-weight:800;color:var(--red);font-size:14px;letter-spacing:.1em;text-transform:uppercase}.card h3{margin:2px 0;font-size:22px}.card p{margin:0;color:var(--muted);font-size:16px}.card .w{font-weight:900;color:var(--ink)}
.spons{padding:44px 0;text-align:center}.spons h3{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.sp{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 40px;align-items:center}.sp img{height:40px}.txt{font:700 17px Georgia;text-align:center;line-height:1}.txt small{display:block;font:700 9px Figtree;letter-spacing:.24em;text-transform:uppercase;color:#8a6d2f}.fq{font:italic 800 18px Figtree}.fq i{color:var(--red)}
footer{background:var(--navy);color:#c9d6db;padding:30px 0 44px;font-size:16px}
@media(max-width:900px){.credit{display:none}.nextcard{grid-template-columns:1fr!important}.cal{display:flex;gap:10px;align-items:center;justify-content:center;width:auto!important}.cal b{font-size:34px!important}nav{flex-wrap:nowrap!important;overflow-x:auto;width:100%;margin:0!important;scrollbar-width:none}nav a{white-space:nowrap}.hero{min-height:0}.copy{padding:30px 0 100px}.bar{flex-wrap:wrap}nav{margin:0}nav a{font-size:15px;padding:6px 9px}.hero:after{background:linear-gradient(0deg,rgba(6,12,16,.95) 30%,rgba(6,12,16,.5))}.nextcard{grid-template-columns:auto 1fr;padding:20px}.nextcard .go{grid-column:1/-1}.pots,.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.btn.light{margin:10px 0 0}.numbers{gap:20px}}
</style></head><body><div id="app"></div>
<script src="data.js"></script><script>
const c=D.champ,n=D.next;
const lanes=`<svg class="bg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a22"/><stop offset="1" stop-color="#d79a57"/></linearGradient><radialGradient id="glow" cx=".72" cy=".3" r=".5"><stop offset="0" stop-color="#ffe3a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe3a8" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="800" fill="#1a1410"/><rect width="1600" height="250" fill="#0e0b09"/><rect y="180" width="1600" height="70" fill="#231a13"/>
${[0,1,2].map(i=>{const x=1000+i*200;const bx=600+i*420;return `<path d="M${x-10} 250 L${x+80} 250 L${bx+190} 800 L${bx-130} 800Z" fill="url(#w)"/><path d="M${x-10} 250 L${x-24} 250 L${bx-170} 800 L${bx-130} 800Z" fill="#2a1d14"/><path d="M${x+80} 250 L${x+94} 250 L${bx+230} 800 L${bx+190} 800Z" fill="#2a1d14"/>`+[0,1,2,3].map(r=>[...Array(r+1)].map((_,k)=>`<g transform="translate(${x+35+(k-r/2)*20},${238-r*8}) scale(.8)"><ellipse cx="0" cy="22" rx="8" ry="3" fill="#000" opacity=".3"/><path d="M0 -14 C5 -14 6 -6 4 -2 C9 4 9 14 5 22 L-5 22 C-9 14 -9 4 -4 -2 C-6 -6 -5 -14 0 -14Z" fill="#f6f1e8"/><rect x="-4" y="-4" width="8" height="2.5" fill="#c7362b"/></g>`).join('')).join('')}).join('')}
<rect width="1600" height="800" fill="url(#glow)"/></svg>`;
document.getElementById('app').innerHTML=`
<section class="hero">${lanes}<div class="wrap"><div class="bar"><img src="../img/tour-logo.png" alt=""><b>9-TAP TOUR</b><nav>${D.nav.map((x,i)=>`<a href="#" class="${i?'':'on'}">${x}</a>`).join('')}<a href="#" class="join">Join</a></nav></div>
<div class="copy"><div class="eyebrow">Latest champion · ${c.where} · ${c.date}</div><h1>${c.name}</h1><p>From Vancouver Island at 3 AM to an 841 series and his first Tour title. ${c.head}</p>
<a class="btn" href="#">Read his story</a><a class="btn light" href="#">Full results</a>
<div class="numbers"><div><b>${c.series}</b><span>Series</span></div><div><b>${c.won}</b><span>Won</span></div><div><b>${c.entries}</b><span>Entries</span></div><div><b>${c.paid}</b><span>Paid out</span></div></div></div></div>
<div class="credit">Photo area: a big tournament photo goes here</div></section>
<div class="wrap next"><div class="nextcard"><div class="cal"><span>${n.mon.toUpperCase()}</span><b>${n.day}</b><span>${n.dow.slice(0,3).toUpperCase()}</span></div>
<div><div class="eyebrow" style="color:var(--red)">Next tournament · ${n.rel}</div><h2>${n.center}</h2><div class="m">${n.city} · New members arrive an hour early</div><div class="chips">${n.squads.map(s=>`<span>${s} squad</span>`).join('')}</div></div>
<div class="go"><a class="btn" href="#">Full schedule</a></div></div>
<div class="pots"><div class="pot j"><span>9-Tap Jackpot</span><b>${D.jackpot}</b><p>${D.jpNote} Record pot ${D.record}.</p></div><div class="pot p"><span>Progressive Pot</span><b>${D.progressive}</b><p>${D.progNote}</p></div></div></div>
<section class="sec"><div class="wrap"><div class="sechead"><div class="eyebrow" style="color:var(--red)">Every Tour champion since January 2025</div><h2>Wall of Champions</h2><div class="toggle"><a href="#" class="on">Wall of Champions</a><a href="#">Jackpot Winners</a></div></div>
<div class="stats">${D.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}${s[2]?'<br>'+s[2]:''}</span></div>`).join('')}</div>
<div class="pick">${D.years.map((y,i)=>`<a href="#" class="${i?'':'on'}">${y}</a>`).join('')}</div><div class="pick">${D.months.map(m=>`<a href="#" class="${m=='Nov'?'on':m=='Dec'?'off':''}">${m}</a>`).join('')}</div>
<div class="cards">${D.wall.slice(0,4).map((w,i)=>`<div class="card"><div class="ph">${PIC(['#b64a3a','#4b6d86','#7a6640','#4c7a5f'][i])}</div><div class="b"><div class="d">${w[0]}</div><h3>${w[1]}</h3><p>${w[2]} · <span class="w">${w[3]}</span></p></div></div>`).join('')}</div></div></section>
<section class="spons"><div class="wrap"><h3>Thank you to our sponsors</h3><div class="sp">${SP()}</div></div></section>
<footer><div class="wrap"><b style="color:#fff">9-Tap Tour Inc.</b> · Handicap singles bowling across the Puget Sound · PO Box 931, Sumner, WA 98390 · (253) 987-7975</div></footer>`;
</script></body></html>
